# Brand runtime hooks share their implementation with .claude/settings.json.
# See system/codex-support.md in the factory (parker-system/ in a brand).
# v17 changes hook definitions: approve the new commands once in the Codex TUI.
# Python 3.11+ and Git are required; Windows uses the standard py launcher.
# Legacy sandbox_mode / --sandbox overrides default_permissions. Check the
# effective permissions; hooks alone are not a filesystem security boundary.

default_permissions = "parker-brain"

[permissions.parker-brain]
extends = ":workspace"

[permissions.parker-brain.filesystem.":workspace_roots"]
"parker-system" = "read"

[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" session-start"
commandWindows = "py -3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" session-start"
timeout = 60
statusMessage = "Checking the method mount"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" craft-context"
commandWindows = "py -3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" craft-context"
timeout = 30
additionalContextLimit = 16000
statusMessage = "Loading the craft catalog"

[[hooks.PreToolUse]]
matcher = "Bash|shell|local_shell|exec_command"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" git-guard --codex"
commandWindows = "py -3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" git-guard --codex"
timeout = 30
statusMessage = "Checking the git procedure"

[[hooks.PreToolUse]]
matcher = "Bash|shell|local_shell|exec_command|Edit|Write|NotebookEdit|apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" mount-guard"
commandWindows = "py -3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" mount-guard"
timeout = 30
statusMessage = "Guarding the method mount"

[[hooks.PostToolUse]]
matcher = "mcp__.*"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" pull-log"
commandWindows = "py -3 -c \"from pathlib import Path; import subprocess, runpy; r = subprocess.run(['git', 'rev-parse', '--show-toplevel'], capture_output=True, text=True); p = Path(r.stdout.strip()) / '.claude/hooks/run-hook.py'; runpy.run_path(str(p), run_name='__main__') if r.returncode == 0 and p.is_file() else None\" pull-log"
timeout = 30
